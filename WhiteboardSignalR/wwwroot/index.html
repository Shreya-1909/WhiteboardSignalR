<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Real-Time Collaboration Whiteboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
        #board-container { flex: 3; position: relative; background: #f5f5f5; }
        #whiteboard { border: 1px solid #ccc; background: #fff; cursor: crosshair; }
        .cursor-label {
            position: absolute;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            pointer-events: none;
            transform: translate(-50%, -100%);
            background: rgba(0,0,0,0.6);
            color: #fff;
            white-space: nowrap;
        }
        #sidebar { flex: 1; display: flex; flex-direction: column; border-left: 1px solid #ddd; }
        #chat { flex: 2; display: flex; flex-direction: column; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 8px; }
        #chat-input { display: flex; padding: 8px; gap: 4px; }
        #chat-input input { flex: 1; padding: 4px 6px; }
        #controls { padding: 8px; border-bottom: 1px solid #ddd; }
        #replay-btn { margin-top: 8px; }
        #metrics { margin-top: 8px; font-size: 12px; }
        #boardsList button { margin: 2px 0; width: 100%; text-align: left; }
    </style>
</head>
<body>
    <div id="board-container">
        <canvas id="whiteboard"></canvas>
    </div>

    <div id="sidebar">
        <div id="controls">
            <label>Board ID:
                <input id="boardId" value="default" />
            </label>
            <br />
            <label>Your name:
                <input id="userName" value="User-1234" />
            </label>
            <button id="joinBtn">Join Board</button>
            <br />
            <label>Color:
                <input type="color" id="colorPicker" value="#000000" />
            </label>
            <label>Width:
                <input type="number" id="widthPicker" min="1" max="10" value="2" />
            </label>
            <button id="replay-btn">Replay Board</button>
            <button id="exportBtn">Export PNG</button>
            <div id="metrics">
                <strong>Avg latency:</strong> <span id="latencyValue">–</span> ms
            </div>
            <div>
                <strong>Active boards:</strong>
                <ul id="boardsList"></ul>
            </div>
            <button id="bePresenterBtn">Become Presenter</button>
            <button id="releasePresenterBtn">Stop Presenting</button>
            <div id="presenterStatus"></div>
        </div>

        <div id="chat">
            <div id="chat-messages"></div>
            <div id="chat-input">
                <input id="chatText" placeholder="Type a message..." />
                <button id="sendChat">Send</button>
            </div>
        </div>
    </div>

    <script src="/js/whiteboard.js"></script>
</body>
</html>
